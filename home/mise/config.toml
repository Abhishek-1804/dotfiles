[tools]
atuin = "latest"
aws-cli = { version = "latest", symlink_bins = "true" }
claude = "latest"
codex = "latest"
croc = "latest"
gh = "latest"
go = "latest"
k9s = "latest"
kubectl = "latest"
node = "latest"
ollama = "latest"
opencode = { version = "latest", allow_builds = ["@opencode/cli"] }
